// Véu por região imediata: 510 regiões do IBGE, cada uma com seu eleitorado e seus votos (2º turno 2022 como base da simulação).
// Cada ponto ≈ VPD eleitores e pertence a uma região; acende com o progresso dela e ganha a cor pela proporção de votos dela.
const $=id=>document.getElementById(id),cv=$('m'),G=300;
const COS=Math.cos(15*Math.PI/180),P=([x,y])=>[x*COS,-y],hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const MIST=hex('#cfd9ff'),RES={c22:'#2e8bff',c13:'#ff3344',br:'#4a4e5c',nu:'#262933'},K=['c22','c13','br','nu','ab'];
Promise.all(['data/ri.json?v=2','data/uf.json?v=2','data/hist.json?v=1'].map(u=>fetch(u).then(r=>r.json()))).then(([RG,UFG,HIST])=>{
  // projeção e raster: cada célula guarda o índice da região
  RG.forEach(r=>r.poly=r.poly.map(s=>s.map(P)));const ufp=Object.values(UFG).flat().map(s=>s.map(P));
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const r of RG)for(const s of r.poly)for(const[x,y]of s){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}
  const k=G/(x1-x0),H=Math.ceil((y1-y0)*k),tx=([x,y])=>[(x-x0)*k,(y-y0)*k];
  RG.forEach(r=>r.poly=r.poly.map(s=>s.map(tx)));const ufs=ufp.map(s=>s.map(tx));
  const oc=new OffscreenCanvas(G,H),o=oc.getContext('2d');
  const pa=RG.map((r,i)=>{const p=new Path2D();for(const s of r.poly){s.forEach(([x,y],j)=>p[j?'lineTo':'moveTo'](x,y));p.closePath()}o.fillStyle=`rgb(${(i+1)>>8},${(i+1)&255},${(i+1)*151+89&255})`;o.fill(p);return p});
  const d=o.getImageData(0,0,G,H).data,cell=new Int16Array(G*H).fill(-1),cnt=RG.map(()=>0);
  // azul = checksum do índice; pixel de borda (cor ≠ de algum vizinho) ainda confere a geometria, pois a mistura do antialiasing pode bater o checksum por acaso. Rejeitados herdam um vizinho válido
  const px=q=>d[q*4]<<16|d[q*4+1]<<8|d[q*4+2],edge=q=>{const v=px(q),x=q%G;return x>0&&px(q-1)!==v||x<G-1&&px(q+1)!==v||q>=G&&px(q-G)!==v||q<G*H-G&&px(q+G)!==v},
